name: Build .deb

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Kompletná inštalácia Theos + SDK + iOS Toolchain ─────────────────────
      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: 'theos'
          theos-sdks: 'https://github.com/theos/sdks'

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build deb
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          # Overenie, že clang existuje (pre diagnostiku, ak by náhodou chýbal)
          ls -la "$THEOS/toolchain/linux/iphone/bin/clang" || true
          gmake package FINALPACKAGE=1

      # ── Nájdenie .deb súboru ──────────────────────────────────────────────────
      - name: Find deb
        id: deb
        run: |
          DEB=$(find packages/ -name "*.deb" | head -1)
          echo "path=$DEB"             >> "$GITHUB_OUTPUT"
          echo "name=$(basename $DEB)" >> "$GITHUB_OUTPUT"

      # ── Nahratie artefaktu ───────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BadooCapitalAI-deb
          path: ${{ steps.deb.outputs.path }}
          retention-days: 30

      # ── Vytvorenie Release (len pri tagoch) ──────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.deb.outputs.path }}
          name: ${{ github.ref_name }}
          body: |
            ## BadooCapitalAI ${{ github.ref_name }}

            ### Install on device
            ```bash
            dpkg -i BadooCapitalAI_*.deb && uicache -a
