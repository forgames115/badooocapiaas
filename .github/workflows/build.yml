name: Build .deb

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-13 # Consider using a more stable runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Theos deps (ldid, make, dpkg, etc.) ───────────────────────────────
      - name: Install deps via Homebrew
        run: |
          brew install ldid make xz dpkg # dpkg provides dpkg-deb

      # ── Theos ───────────────────────────────────────────────────────────────
      - name: Clone Theos
        run: |
          git clone --recursive --depth=1 \
            https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      # ── iOS SDK ─────────────────────────────────────────────────────────────
      - name: Download iOS 16.5 SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          curl -fL \
            "https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz" \
            -o "$HOME/theos/sdks/sdk.tar.xz"
          tar -xJf "$HOME/theos/sdks/sdk.tar.xz" -C "$HOME/theos/sdks"
          rm "$HOME/theos/sdks/sdk.tar.xz"

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build deb
        run: gmake package FINALPACKAGE=1

      # ... rest of the steps (Find deb, Upload artifact, Create Release)
