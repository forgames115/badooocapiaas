name: Build .deb

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git fakeroot dpkg-dev clang xz-utils curl

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth=1 https://github.com/theos/theos.git $THEOS
          # CI=1 zabezpečí, že inštalácia prebehne bez interaktívnych otázok
          CI=1 bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Verify Toolchain
        run: |
          export THEOS=$HOME/theos
          ls -la $THEOS/toolchain/linux/iphone/bin/clang
          $THEOS/toolchain/linux/iphone/bin/clang --version

      - name: Download iOS SDK
        run: |
          export THEOS=$HOME/theos
          mkdir -p $THEOS/sdks
          curl -fL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o $THEOS/sdks/sdk.tar.xz
          tar -xJf $THEOS/sdks/sdk.tar.xz -C $THEOS/sdks
          rm $THEOS/sdks/sdk.tar.xz

      - name: Build deb
        run: |
          export THEOS=$HOME/theos
          gmake package FINALPACKAGE=1

      - name: Find deb
        id: deb
        run: |
          DEB=$(find packages/ -name "*.deb" | head -1)
          echo "path=$DEB" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $DEB)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BadooCapitalAI-deb
          path: ${{ steps.deb.outputs.path }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.deb.outputs.path }}
          name: ${{ github.ref_name }}
          body: |
            ## BadooCapitalAI ${{ github.ref_name }}
            ### Install on device
            ```bash
            dpkg -i BadooCapitalAI_*.deb && uicache -a
