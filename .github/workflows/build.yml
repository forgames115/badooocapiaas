name: Build .deb

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    # Používame Ubuntu 22.04, aby sme obišli čakanie na Mac a mali stabilné prostredie
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Inštalácia ldid (Oprava chyby "Unable to locate package ldid") ─────
      - name: Install ldid
        uses: MOZGIII/install-ldid-action@v1
        with:
          tag: v2.1.5-procursus2

      # ── Ostatné závislosti (bez ldid, keďže ho riešime vyššie) ─────────────
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git fakeroot dpkg-dev clang xz-utils

      # ── Theos ───────────────────────────────────────────────────────────────
      - name: Clone Theos
        run: |
          git clone --recursive --depth=1 \
            https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      # ── iOS SDK ─────────────────────────────────────────────────────────────
      - name: Download iOS 16.5 SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          curl -fL \
            "https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz" \
            -o "$HOME/theos/sdks/sdk.tar.xz"
          tar -xJf "$HOME/theos/sdks/sdk.tar.xz" -C "$HOME/theos/sdks"
          rm "$HOME/theos/sdks/sdk.tar.xz"

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build deb
        run: gmake package FINALPACKAGE=1

      # ── Nájdenie .deb súboru ──────────────────────────────────────────────────
      - name: Find deb
        id: deb
        run: |
          DEB=$(find packages/ -name "*.deb" | head -1)
          echo "path=$DEB"             >> "$GITHUB_OUTPUT"
          echo "name=$(basename $DEB)" >> "$GITHUB_OUTPUT"

      # ── Nahratie súboru (aby si si ho mohol stiahnuť) ────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BadooCapitalAI-deb
          path: ${{ steps.deb.outputs.path }}
          retention-days: 30

      # ── Vytvorenie Release (len ak pridáš tag napr. v1.0) ────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.deb.outputs.path }}
          name: ${{ github.ref_name }}
          body: |
            ## BadooCapitalAI ${{ github.ref_name }}

            ### Install on device
            ```bash
            dpkg -i BadooCapitalAI_*.deb && uicache -a
