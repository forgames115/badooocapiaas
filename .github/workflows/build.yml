name: Build .deb

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Deps ────────────────────────────────────────────────────────────────
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates make \
            clang lld \
            dpkg-dev fakeroot \
            libplist-dev libxml2-dev

      # ── Theos ───────────────────────────────────────────────────────────────
      - name: Clone Theos
        run: |
          git clone --recursive --depth=1 \
            https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      # ── iOS SDK ─────────────────────────────────────────────────────────────
      - name: Download iOS 16.5 SDK
        run: |
          curl -sSL \
            "https://github.com/theos/sdks/releases/download/main/iPhoneOS16.5.sdk.tar.xz" \
            -o sdk.tar.xz
          mkdir -p "$HOME/theos/sdks"
          tar -xJf sdk.tar.xz -C "$HOME/theos/sdks"
          rm sdk.tar.xz

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build deb
        run: |
          make package FINALPACKAGE=1
        env:
          THEOS: ${{ env.THEOS }}

      # ── Locate .deb ──────────────────────────────────────────────────────────
      - name: Find deb
        id: deb
        run: |
          DEB=$(find packages/ -name "*.deb" | head -1)
          echo "path=$DEB"            >> "$GITHUB_OUTPUT"
          echo "name=$(basename $DEB)" >> "$GITHUB_OUTPUT"

      # ── Artifact (every build) ───────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BadooCapitalAI-deb
          path: ${{ steps.deb.outputs.path }}
          retention-days: 30

      # ── Release (tags only) ──────────────────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.deb.outputs.path }}
          name: ${{ github.ref_name }}
          body: |
            ## BadooCapitalAI ${{ github.ref_name }}

            ### Install on device
            ```bash
            dpkg -i BadooCapitalAI_*.deb
            uicache -a
            ```
            Then: **Settings → BadooCapitalAI** → paste license key → flip enable toggle.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
